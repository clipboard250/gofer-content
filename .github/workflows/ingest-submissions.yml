name: Ingest Community Submissions

on:
  workflow_dispatch: {}   # manual only while testing

permissions:
  contents: write         # allow commit/push

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run the ingester script
        run: node scripts/ingest-submissions.js

      - name: Commit & push updates
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "gofer-bot"
            git config user.email "bot@users.noreply.github.com"
            git add community-bulletin-board/spots.json community-bulletin-board/events.json
            git commit -m "auto: ingest new community submissions"
            git push
          else
            echo "No new submissions to add."
          fi
