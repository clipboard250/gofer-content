name: Ingest Community Submissions

on:
  schedule:
    - cron: "0 0 * * *"      # run once a day at midnight UTC
  workflow_dispatch: {}       # allow manual run from Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install csv-parse
        run: npm install csv-parse@5.5.3

      - name: Run the ingester script
        run: node scripts/ingest-submissions.js

      - name: Commit & push updates
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "gofer-bot"
            git config user.email "bot@users.noreply.github.com"
            git add community-bulletin-board/spots.json community-bulletin-board/events.json
            git commit -m "auto: ingest new community submissions"
            git push
          else
            echo "No new submissions to add."
          fi
