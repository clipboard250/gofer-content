<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gofer — Community bulletin board</title>
  <meta name="description" content="Services, events, causes, and more from the Gofer community." />
  <meta name="color-scheme" content="light dark" />
  <style>
    :root{ --bg:#0b0b0c; --panel:#121216; --text:#f3f4f6; --muted:#a1a1aa; --brand:#ff6a00; --brand2:#7FFF00; --card:#0f1013; --border:#252632; --chip:#1b1c22; --round:18px; --gap:18px; --shadow:0 20px 40px rgba(0,0,0,.25);}
    @media (prefers-color-scheme: light){ :root{ --bg:#fafafa; --panel:#fff; --text:#0b0b0c; --muted:#6b7280; --card:#fff; --border:#e7e7ee; --chip:#f3f4f8; }}
    html,body{height:100%}
    body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:1200px;margin:0 auto;padding:22px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .logo{display:flex;align-items:center;gap:10px;font-weight:900}
    .logo b{background:var(--brand);color:#0b0b0c;padding:6px 10px;border-radius:12px}

    .bar{display:grid;grid-template-columns:1.1fr .6fr .6fr .6fr .5fr;gap:10px;align-items:center;margin:10px 0 10px}
    @media(max-width:950px){.bar{grid-template-columns:1fr 1fr;gap:8px}}
    @media(max-width:700px){.bar{grid-template-columns:1fr;gap:8px}}

    input, select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text);box-sizing:border-box}
    .btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#0b0b0c;font-weight:800;border:0;border-radius:14px;padding:12px 14px;cursor:pointer;text-decoration:none}

    .quick{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:var(--panel);cursor:pointer}
    .pill.active{border-color:var(--brand2); box-shadow:0 0 0 2px rgba(127,255,0,.15) inset}

    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
    @media(max-width:1000px){.grid{grid-template-columns:1fr 1fr}}
    @media(max-width:640px){.grid{grid-template-columns:1fr}}

    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--round);overflow:hidden;display:flex;flex-direction:column}
    .hero{padding:16px;background:linear-gradient(135deg,var(--brand) 0%, var(--brand2) 100%);color:#0b0b0c}
    .title{font-weight:900;font-size:20px}
    .sub{margin-top:6px;color:#0b0b0c;opacity:.92;font-weight:600}
    .pad{padding:14px}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
    .chip{background:var(--chip);border:1px solid var(--border);padding:6px 10px;border-radius:999px;font-size:12px;text-decoration:none;color:var(--text);display:inline-block}
    .chip:hover{color:var(--text);text-decoration:none}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .cta{display:inline-flex;align-items:center;gap:8px;background:#0b0b0c;color:#fff;font-weight:800;padding:10px 12px;border-radius:12px;border:0;text-decoration:none}
    @media(prefers-color-scheme: light){.cta{background:#111827}}
    .footer{margin-top:10px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo"><b>GOFER</b><span>Community bulletin board</span></div>
      <a class="btn" href="/community-bulletin-board/submit.html">Add a listing</a>
    </header>

    <div class="bar">
      <input id="q" placeholder="Search names and blurbs…"/>
      <select id="type">
        <option value="">All types</option>
        <option>Business/Service</option><option>Event</option><option>Hiring</option>
        <option>Art/Project</option><option>Cause/Fundraiser</option><option>DJ/Podcast/Music</option>
      </select>
      <select id="industry">
        <option value="">All industries</option>
        <option>Home Services</option><option>Music</option><option>Art</option><option>Tech</option><option>Wellness</option>
        <option>Legal</option><option>Education</option><option>Nonprofit</option><option>Events</option><option>Food</option>
        <option>Trades</option><option>Real Estate</option><option>Media</option><option>Retail</option><option>Hospitality</option>
        <option>Sports</option><option>Logistics</option><option>Construction</option><option>Finance</option><option>Beauty</option>
      </select>
      <input id="city" placeholder="City (optional)"/>
      <select id="sort"><option>New</option><option>A—Z</option><option>Upcoming</option></select>
    </div>

    <!-- Quick filters -->
    <div class="quick" role="group" aria-label="Quick filters">
      <button class="pill" id="pillBiz" type="button">Businesses</button>
      <button class="pill" id="pillEvt" type="button">Events</button>
      <span class="footer" id="count"></span>
    </div>

    <div id="grid" class="grid" aria-live="polite"></div>
    <div class="footer">Made with Gofer • Pooling reach so the whole crew wins</div>
  </div>

  <script>
  const $ = id => document.getElementById(id);
  const grid = $('grid');
  let items = [];

  // 1) Load both files (spots + events) and merge
  async function load(){
    const [spots, extraEvents] = await Promise.all([
      fetch('spots.json', {cache:'no-store'}).then(r => r.ok ? r.json() : []).catch(()=>[]),
      fetch('events.json', {cache:'no-store'}).then(r => r.ok ? r.json() : []).catch(()=>[])
    ]);
    // Normalize: add machine dates so we can sort/filter correctly
    items = normalize([...(Array.isArray(spots)?spots:[]), ...(Array.isArray(extraEvents)?extraEvents:[])]);
    render();
  }
  load();

  // 2) Hook up filters
  ["q","type","industry","city","sort"].forEach(id => $(id).addEventListener("input", render));
  const pillBiz = $('pillBiz'), pillEvt = $('pillEvt');
  pillBiz.addEventListener('click', () => { togglePill(pillBiz); $('type').value = pillBiz.classList.contains('active') ? 'Business/Service' : ''; render(); });
  pillEvt.addEventListener('click', () => { togglePill(pillEvt); $('type').value = pillEvt.classList.contains('active') ? 'Event' : ''; $('sort').value = pillEvt.classList.contains('active') ? 'Upcoming' : $('sort').value; render(); });
  function togglePill(el){ el.classList.toggle('active'); if(el===pillBiz && pillEvt.classList.contains('active')) pillEvt.classList.remove('active'); if(el===pillEvt && pillBiz.classList.contains('active')) pillBiz.classList.remove('active'); }

  // 3) Normalize helper: create _start/_end Date objects if possible
  function normalize(arr){
    return arr.map(x => {
      const start = x.start_at ? new Date(x.start_at) : guessFromWhen(x.when);
      const end   = x.end_at   ? new Date(x.end_at)   : null;
      return {...x, _start: isFinite(start) ? start : null, _end: isFinite(end) ? end : null};
    });
  }

  // Try to guess from a loose "when" string. If it's not a real date, return null.
  function guessFromWhen(s=''){
    const d = new Date(s);
    return isFinite(d) ? d : null;
  }

  // 4) Render with filters + “upcoming only” for Event
  function render(){
    const q = $('q').value.toLowerCase();
    const t = $('type').value;
    const ind = $('industry').value;
    const city = $('city').value.toLowerCase();
    const sort = $('sort').value;

    let rows = items.filter(x =>
      (!t || x.type === t) &&
      (!ind || x.industry === ind) &&
      (!city || (x.where||"").toLowerCase().includes(city)) &&
      (x.title.toLowerCase().includes(q) || (x.tagline||"").toLowerCase().includes(q))
    );

    // If we're looking at Events, keep upcoming only
    if (t === 'Event' || sort === 'Upcoming') {
      const today = new Date(); today.setHours(0,0,0,0);
      rows = rows.filter(x => x.type === 'Event' ? (x._start && x._start >= today) : true);
    }

    // Sorting
    rows.sort((a,b) => {
      if (sort === "A—Z") return a.title.localeCompare(b.title);
      if (sort === "Upcoming") {
        const aa = a._start ? a._start.getTime() : Number.POSITIVE_INFINITY;
        const bb = b._start ? b._start.getTime() : Number.POSITIVE_INFINITY;
        return aa - bb;
      }
      // Default: newest created_at first
      return (new Date(b.created_at||0)) - (new Date(a.created_at||0));
    });

    $('count').textContent = rows.length + ' result' + (rows.length===1? '':'s');
    grid.innerHTML = rows.map(card).join('');
  }

  // 5) Card HTML (unchanged except the date chip now prefers start_at)
  function card(x){
    const perks = (x.perks||[]).slice(0,3).map(p=>`<span class="chip">${esc(p)}</span>`).join('');
    const when = x.type === 'Event'
      ? `<span class="chip">${prettyDateRange(x)}</span>`
      : (x.when ? `<span class="chip">${esc(x.when)}</span>` : '');
    const where = x.where ? `<span class="chip">${esc(x.where)}</span>` : '';
    const icons = (x.links||[]).slice(0,7).map(l=> icon(l.type,l.href)).join('');
    const cta = x.type==='Event' ? 'RSVP' : x.type==='Hiring' ? 'Apply' : x.type==='Cause/Fundraiser' ? 'Donate' : 'Contact';
    const primary = (x.links||[]).find(l => l.type==='email'||l.type==='phone'||l.type==='website')?.href || '#';
    return `
      <article class="card">
        <div class="hero">
          <div class="title">${esc(x.title)}</div>
          <div class="sub">${esc(x.tagline||'')}</div>
        </div>
        <div class="pad">
          <div class="chips">${perks} ${when} ${where}</div>
          <div class="row" style="margin:10px 0">${favicon(primary)} ${icons}</div>
          <div class="row">
            <a class="cta" href="${primary}" target="_blank" rel="noopener">${cta}</a>
            <a class="cta" href="/community-bulletin-board/claim.html?slug=${encodeURIComponent(x.slug||'')}&title=${encodeURIComponent(x.title)}">Claim</a>
            <a class="cta" href="/community-bulletin-board/suggest.html?slug=${encodeURIComponent(x.slug||'')}&title=${encodeURIComponent(x.title)}" style="background:transparent;color:var(--text);border:1px solid var(--border)">Suggest edit</a>
          </div>
        </div>
      </article>`;
  }

  function prettyDateRange(x){
    if (!x._start) return esc(x.when||'Date TBA');
    const opts = {month:'short', day:'numeric'};
    const tOpts = {hour:'numeric', minute:'2-digit'};
    const d1 = x._start.toLocaleDateString(undefined, opts);
    const t1 = x._start.toLocaleTimeString(undefined, tOpts).replace(':00','');
    if (!x._end) return `${d1} · ${t1}`;
    const sameDay = x._start.toDateString() === x._end.toDateString();
    const d2 = x._end.toLocaleDateString(undefined, opts);
    const t2 = x._end.toLocaleTimeString(undefined, tOpts).replace(':00','');
    return sameDay ? `${d1} · ${t1}–${t2}` : `${d1}–${d2}`;
  }

  function favicon(href){
    try{ const url = new URL(href); const src = 'https://www.google.com/s2/favicons?domain='+url.hostname+'&sz=64';
      return `<img alt="" src="${src}" style="width:20px;height:20px;border-radius:4px;margin-right:6px;vertical-align:middle">`;
    }catch(e){ return ''; }
  }
  function icon(type,href){
    const map = { website:'🌐', instagram:'📸', facebook:'📘', twitter:'𝕏', tiktok:'🎵', linkedin:'💼', youtube:'▶️', soundcloud:'☁️', bandcamp:'🏕️', eventbrite:'🎫', venmo:'💸', paypal:'💳', email:'✉️', phone:'📞' };
    if(!href) return '';
    const label = (type||'Link').replace(/\b\w/g,c=>c.toUpperCase());
    return `<a class="chip" href="${href}" target="_blank" rel="noopener" title="${esc(label)}">${map[type]||'🔗'} ${esc(label)}</a>`;
  }
  function esc(s=''){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c])); }
  </script>
</body>
</html>
