<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thanks — Gofer Community</title>
<meta name="color-scheme" content="light dark">
<style>
  :root{ --bg:#0b0b0c; --panel:#121216; --text:#f3f4f6; --muted:#a1a1aa; --brand:#ff6a00; --brand2:#7FFF00; --border:#252632; --radius:16px;}
  @media (prefers-color-scheme: light){ :root{ --bg:#fafafa; --panel:#fff; --text:#0b0b0c; --muted:#6b7280; --border:#e7e7ee; }}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial,sans-serif}
  .wrap{max-width:680px;margin:0 auto;padding:22px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px;text-align:center}
  h1{margin:0 0 8px}
  p{color:var(--muted)}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;border:0;cursor:pointer;font-weight:800}
  .brand{background:linear-gradient(180deg,#ff6a00,#8a2c00);color:#111}
  .ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Thanks — listing received</h1>
      <p>I’ll review it and post it to the board. You’ll hear from me if I need anything.</p>
      <div class="row">
        <a class="btn brand" href="/community-bulletin-board/">See the board</a>
        <a class="btn ghost" href="/">Back to Gofer Content</a>
      </div>
    </div>
  </div>
</body>
</html>
