<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suggest an edit — Gofer Community</title>
<meta name="color-scheme" content="light dark">
<style>
  :root{ --bg:#0b0b0c; --panel:#121216; --text:#f3f4f6; --muted:#a1a1aa; --brand:#ff6a00; --brand2:#7FFF00; --border:#252632; --radius:16px;}
  @media (prefers-color-scheme: light){ :root{ --bg:#fafafa; --panel:#fff; --text:#0b0b0c; --muted:#6b7280; --border:#e7e7ee; }}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:22px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  label{font-size:14px;color:var(--muted)}
  input,textarea{width:100%;background:#111;color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:12px;border:0;cursor:pointer;font-weight:800}
  .brand{background:linear-gradient(180deg,#ff6a00,#8a2c00);color:#111}
  .ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Suggest an edit</h1>
      <p id="summary" style="color:#a1a1aa;margin-top:-6px"></p>

      <form action="https://formspree.io/f/xovkloyz" method="POST">
        <input type="hidden" name="_subject" value="Community Edit Suggestion — Gofer">
        <input type="hidden" name="_redirect" value="https://gofercontent.com/community-bulletin-board/thanks.html">
        <input type="hidden" name="form_source" value="community-suggest">
        <input type="hidden" id="slug" name="slug">
        <input type="hidden" id="title" name="title">

        <label>Your name (optional)</label>
        <input name="requester">

        <label>What needs to change?</label>
        <textarea name="suggestion" required placeholder="Tell me what’s wrong and the correct info."></textarea>

        <div class="row" style="margin-top:10px">
          <button class="btn brand" type="submit">Send suggestion</button>
          <a class="btn ghost" href="/community-bulletin-board/">Back to board</a>
        </div>
      </form>
    </div>
  </div>
<script>
  const p = new URL(location.href).searchParams;
  const slug = p.get('slug')||''; const title = p.get('title')||'';
  document.getElementById('slug').value = slug;
  document.getElementById('title').value = title;
  document.getElementById('summary').textContent = title ? `Listing: ${title}` : '';
</script>
</body>
  <script src="/assets/js/hotfix-formspree.js"></script>
</html>
