<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gofer — Landing Page Generator</title>
  <meta name="description" content="Answer a few friendly questions. See your landing page live. Copy or download the HTML, or book a setup call." />
  <meta name="robots" content="index,follow">
  <meta name="color-scheme" content="dark light">
  <style>
    :root{
      --primary:#F57D31;--accent:#7FFF00;--bg:#0B0F19;--text:#E5E7EB;--muted:#BFC3CB;
      --radius:16px;--shadow:0 10px 25px rgba(0,0,0,.25);
      --h:ui-sans-serif,system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial;
      --b:ui-sans-serif,system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:linear-gradient(180deg,#0B0F19 0%,#111827 100%);color:var(--text);font-family:var(--b)}
    a{color:inherit;text-decoration:none}
    .wrap{display:grid;grid-template-columns:380px 1fr;min-height:100vh}
    @media (max-width:980px){.wrap{grid-template-columns:1fr}.panel{position:sticky;top:0;z-index:5}}
    .panel{padding:20px;border-right:1px solid rgba(255,255,255,.06);background:rgba(17,24,39,.6);backdrop-filter:blur(8px)}
    .panel h1{font-family:var(--h);font-size:20px;margin:0 0 12px}
    .grid{display:grid;gap:12px}
    .row{display:grid;gap:6px}
    label{font-size:12px;color:var(--muted)}
    input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#0F172A;color:var(--text)}
    textarea{min-height:70px;resize:vertical}
    input[type=color]{height:40px;padding:0}
    small.tip{font-size:12px;color:var(--muted)}
    .inline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .btn{display:inline-flex;align-items:center;gap:8px;border:0;padding:10px 14px;border-radius:12px;background:var(--primary);color:#111;cursor:pointer;box-shadow:var(--shadow);font-weight:800}
    .btn.secondary{background:#1F2937;color:#fff}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.15);color:#fff}
    .btn.mini{padding:6px 10px;border-radius:10px;font-weight:700}
    .tip{font-size:12px;color:var(--muted)}
    .preview-shell{padding:28px}
    .preview{border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:#0B0F19}
    .hero{padding:64px 24px;position:relative}
    .hero.has-bg{background-size:cover;background-position:center}
    .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.65))}
    .hero-inner{position:relative;max-width:1100px;margin:0 auto;display:grid;gap:18px;justify-items:center;text-align:center}
    .kicker{color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
    .title{font-family:var(--h);font-size:42px;line-height:1.1;margin:0}
    .subtitle{max-width:820px;opacity:.95}
    .helper{max-width:880px;color:#cbd5e1}
    .cta-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    .cta{padding:12px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:var(--primary);color:#111;font-weight:800;text-decoration:none}
    .cta.secondary{background:transparent;color:var(--text)}
    .features{padding:36px 24px;background:rgba(255,255,255,.02);border-top:1px solid rgba(255,255,255,.06)}
    .features-grid{max-width:1100px;margin:0 auto;display:grid;gap:16px;grid-template-columns:repeat(3,1fr)}
    @media (max-width:900px){.features-grid{grid-template-columns:1fr}}
    .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px}
    .card h3{margin:0 0 6px;font-size:18px}
    .footer{padding:20px 24px;border-top:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
    /* toast + confetti */
    #toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#111;border:1px solid rgba(255,255,255,.15);color:#fff;padding:8px 12px;border-radius:10px;display:none;z-index:50}
    .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
    .confetti i{position:absolute;width:8px;height:8px;background:var(--primary);opacity:.9;border-radius:2px;animation:fall 900ms linear forwards}
    @keyframes fall{to{transform:translateY(110vh) rotate(220deg);opacity:.2}}
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="panel">
      <h1>⚡ Landing Page Generator</h1>
      <div class="grid">

        <!-- Template -->
        <div class="row">
          <label for="tpl">Pick a template</label>
          <select id="tpl">
            <option value="generic">Generic (clean)</option>
            <option value="detailing">Auto Detailing</option>
            <option value="electrician">Electrician / Home Service</option>
            <option value="event">Event / Show</option>
            <option value="church">Church / Community</option>
          </select>
        </div>

        <!-- Industry -->
        <div class="row">
          <label for="industry">Industry</label>
          <select id="industry">
            <option value="home">Home Services</option>
            <option value="trades">Trades</option>
            <option value="auto">Automotive</option>
            <option value="wellness">Wellness</option>
            <option value="food">Restaurants & Food</option>
            <option value="retail">Retail / E-commerce</option>
            <option value="events">Events & Entertainment</option>
            <option value="creative">Creative / Artists</option>
            <option value="community">Faith & Community</option>
            <option value="pro">Professional Services</option>
            <option value="other" selected>Other</option>
          </select>
        </div>

        <!-- Friendly prompts + skip -->
        <div class="row">
          <label for="aud">Who is this for?</label>
          <input id="aud" type="text" placeholder="busy homeowners in St. Pete">
          <small id="hint-aud" class="tip"></small>
          <button type="button" class="btn ghost mini" data-skip="aud">Skip</button>
        </div>

        <div class="row">
          <label for="pain">What’s the main headache you remove?</label>
          <input id="pain" type="text" placeholder="no time to clean their car">
          <small id="hint-pain" class="tip"></small>
          <button type="button" class="btn ghost mini" data-skip="pain">Skip</button>
        </div>

        <div class="row">
          <label for="outcome">What’s the nice result they get?</label>
          <input id="outcome" type="text" placeholder="a clean car without leaving the driveway">
          <small id="hint-outcome" class="tip"></small>
          <button type="button" class="btn ghost mini" data-skip="outcome">Skip</button>
        </div>

        <div class="row">
          <label for="proof">One line of proof (reviews, guarantee, number)</label>
          <input id="proof" type="text" placeholder="120+ 5★ reviews across Tampa Bay">
          <small id="hint-proof" class="tip"></small>
          <button type="button" class="btn ghost mini" data-skip="proof">Skip</button>
        </div>

        <div class="inline" role="group" aria-label="Helper display options">
          <input id="showHelper" type="checkbox"> <label for="showHelper">Show helper line under headline</label>
          <input id="hideKicker" type="checkbox" style="margin-left:12px"> <label for="hideKicker">Hide small kicker text</label>
        </div>

        <hr style="border-color:rgba(255,255,255,.08)">

        <div class="row">
          <label for="title">Brand / Project name</label>
          <input id="title" type="text" value="Start building">
          <small id="hint-title" class="tip"></small>
          <button type="button" class="btn ghost mini" data-skip="title">Use hint</button>
        </div>

        <div class="row">
          <label for="subtitle">One-line value</label>
          <input id="subtitle" type="text" value="Simple systems. Straightforward words. Results you can see.">
          <small id="hint-subtitle" class="tip"></small>
          <button type="button" class="btn ghost mini" data-skip="subtitle">Use hint</button>
        </div>

        <div class="row">
          <label for="kicker">Small kicker (optional)</label>
          <input id="kicker" type="text" value="NEW • JUST LAUNCHED">
        </div>

        <div class="inline">
          <div class="row" style="flex:1"><label for="primary">Primary color</label><input id="primary" type="color" value="#F57D31"></div>
          <div class="row" style="flex:1"><label for="accent">Accent color</label><input id="accent" type="color" value="#7FFF00"></div>
        </div>

        <div class="inline">
          <div class="row" style="flex:1"><label for="bg">Background</label><input id="bg" type="color" value="#0B0F19"></div>
          <div class="row" style="flex:1"><label for="text">Text</label><input id="text" type="color" value="#E5E7EB"></div>
        </div>

        <div class="row">
          <label for="heroImg">Hero background image (URL, optional)</label>
          <input id="heroImg" type="url" placeholder="https://images…">
        </div>

        <div class="inline">
          <div class="row" style="flex:1"><label for="cta1">Button 1</label><input id="cta1" type="text" value="Text us"></div>
          <div class="row" style="flex:1"><label for="cta2">Button 2</label><input id="cta2" type="text" value="See pricing"></div>
        </div>

        <div class="row">
          <label for="features">Feature cards (one per line) • Tip “Headline: short help text”</label>
          <textarea id="features">Same-day service: book in minutes
Up-front pricing: no surprise fees
Mobile-ready: looks great on phones</textarea>
        </div>

        <div class="row">
          <label for="contactUrl">Button link (where both buttons go)</label>
          <input id="contactUrl" type="url" value="mailto:info@gofercontent.com?subject=Landing%20help">
        </div>

        <div class="row">
          <label for="footer">Footer note</label>
          <input id="footer" type="text" value="© 2025 Your Brand. Built with the Gofer Landing Page Generator.">
        </div>

        <div class="inline">
          <button class="btn" id="btnRandom">Shuffle theme</button>
          <button class="btn secondary" id="btnCopy">Copy HTML</button>
          <button class="btn ghost" id="btnDownload">Download HTML</button>
          <button class="btn ghost" id="btnShare">Copy share link</button>
          <a class="btn" id="btnBook" href="https://gofercontent.zohobookings.com/#/4734166000000046014" target="_blank" rel="noopener">Book a setup call</a>
        </div>

        <div class="tip">Change anything — the preview updates live. “Copy share link” saves your settings in the URL. Event listings live on the Community Bulletin Board.</div>
      </div>
    </aside>

    <main class="preview-shell">
      <div id="preview" class="preview" role="region" aria-label="Live page preview"></div>
    </main>
  </div>

  <div id="toast" role="status" aria-live="polite">Saved</div>
  <div class="confetti" aria-hidden="true"></div>

  <script>
    const $=s=>document.querySelector(s);
    const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
    const slug=s=>(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');

    const S={
      aud:'', pain:'', outcome:'', proof:'',
      showHelper:false, hideKicker:false,
      title:'Start building', subtitle:'Simple systems. Straightforward words. Results you can see.', kicker:'NEW • JUST LAUNCHED',
      primary:'#F57D31', accent:'#7FFF00', bg:'#0B0F19', text:'#E5E7EB', heroImg:'',
      cta1:'Text us', cta2:'See pricing', contactUrl:'mailto:info@gofercontent.com?subject=Landing%20help',
      features:['Same-day service: book in minutes','Up-front pricing: no surprise fees','Mobile-ready: looks great on phones'],
      footer:'© 2025 Your Brand. Built with the Gofer Landing Page Generator.'
    };

    /* Template starters (optional quick fill) */
    const T={
      generic:s=>Object.assign(s,{title:'Start building',subtitle:'Simple systems. Straightforward words. Results you can see.',features:['Fast setup','Modern look','Mobile-ready']}),
      detailing:s=>Object.assign(s,{title:'Mobile Detailing, On-Site',subtitle:'We come to you. Inside + out, same-day slots available.',features:['On-site service: we drive to you','Packages: basic to deep clean','Text-first booking: quick reply'],cta1:'Book a detail',contactUrl:'sms:+17273539673'}),
      electrician:s=>Object.assign(s,{title:'Licensed Electrician • Tampa Bay',subtitle:'Small jobs to service upgrades. Up-front pricing.',features:['Licensed + insured','Same-week scheduling','Clean, safe, done right'],cta1:'Request estimate'}),
      event:s=>Object.assign(s,{title:'Backyard House Show',subtitle:'Live music • Sat 6–9pm • Gulfport',features:['All ages','BYO blanket','Free, donations welcome'],cta1:'RSVP'}),
      church:s=>Object.assign(s,{title:'Find a Local Service',subtitle:'Simple times, directions, and ways to get involved.',features:['Sunday + midweek','Kids welcome','Come as you are'],cta1:'Plan a visit'})
    };

    /* Industry hints (Top 10 + Other) */
    const HINTS = {
      home: {aud:'homeowners, landlords, property managers', pain:'hard to find reliable help / hidden fees', outcome:'job done right and on schedule', proof:'120+ 5★ reviews across [area]', title:'Licensed Home Services • [City]', subtitle:'Small fixes to full projects. Up-front pricing.'},
      trades: {aud:'builders, GCs, homeowners', pain:'permits • safety • coordination', outcome:'clean, safe, done right', proof:'state licensed • insured', title:'Licensed [Trade] • [City]', subtitle:'Panels • service • installs. Up-front pricing.'},
      auto: {aud:'busy drivers, fleets', pain:'no time to sit at a shop', outcome:'on-site service', proof:'same-day slots', title:'Mobile Detailing • We Come To You', subtitle:'Inside + out. Same-day available.'},
      wellness: {aud:'clients, patients, members', pain:'confusing booking / insurance', outcome:'easy scheduling and care', proof:'licensed • testimonials', title:'[Practice] • [City]', subtitle:'Care that fits your life.'},
      food: {aud:'diners, families, office lunch', pain:'long waits • unclear menu', outcome:'order fast • clear pricing', proof:'local favorite since [year]', title:'[Restaurant] • [Cuisine]', subtitle:'Order online • pickup or delivery.'},
      retail: {aud:'shoppers, gift buyers', pain:'can’t tell what’s in stock', outcome:'simple product pages', proof:'free returns • fast ship', title:'[Brand] • Shop [Category]', subtitle:'New arrivals weekly.'},
      events: {aud:'attendees, fans', pain:'where • when • how much?', outcome:'simple details + RSVP', proof:'limited seats • family-friendly', title:'[Event] • [Date]', subtitle:'All ages • BYO blanket.'},
      creative: {aud:'clients, fans', pain:'don’t know what you offer', outcome:'see work + book fast', proof:'published • award • press', title:'[Your Name] • [Discipline]', subtitle:'Selected work • bookings open.'},
      community: {aud:'neighbors, families, members', pain:'find times • childcare • parking', outcome:'service times + directions', proof:'all welcome', title:'Find a Local Service', subtitle:'Simple times and ways to get involved.'},
      pro: {aud:'clients • home buyers • owners', pain:'confusing process / fees', outcome:'clear steps and timelines', proof:'licensed • years in practice', title:'[Firm] • [City]', subtitle:'Simple steps. Straight answers.'},
      other: {aud:'your customer', pain:'their main headache', outcome:'what they get from you', proof:'your cleanest proof', title:'Your Project / Business', subtitle:'Say plainly what you do.'}
    };

    function applyHints(key){
      const h = HINTS[key] || HINTS.other;
      $('#hint-aud').textContent = h.aud;
      $('#hint-pain').textContent = h.pain;
      $('#hint-outcome').textContent = h.outcome;
      $('#hint-proof').textContent = h.proof;
      $('#hint-title').textContent = h.title;
      $('#hint-subtitle').textContent = h.subtitle;

      if(!$('#aud').value) $('#aud').placeholder = h.aud;
      if(!$('#pain').value) $('#pain').placeholder = h.pain;
      if(!$('#outcome').value) $('#outcome').placeholder = h.outcome;
      if(!$('#proof').value) $('#proof').placeholder = h.proof;
      if(!$('#title').value) $('#title').value = h.title;
      if(!$('#subtitle').value) $('#subtitle').value = h.subtitle;
    }

    function reflect(){
      ['title','subtitle','kicker','primary','accent','bg','text','heroImg','cta1','cta2','contactUrl','footer'].forEach(k=>{const el=$('#'+k); if(el) el.value=S[k];});
      $('#features').value=S.features.join('\n');
      $('#aud').value=S.aud; $('#pain').value=S.pain; $('#outcome').value=S.outcome; $('#proof').value=S.proof;
      $('#showHelper').checked=!!S.showHelper; $('#hideKicker').checked=!!S.hideKicker;
    }

    function setTheme(){
      document.documentElement.style.setProperty('--primary',S.primary);
      document.documentElement.style.setProperty('--accent',S.accent);
      document.documentElement.style.setProperty('--bg',S.bg);
      document.documentElement.style.setProperty('--text',S.text);
    }

    function helperLine(){
      if(!S.showHelper) return '';
      const bits=[];
      if(S.outcome) bits.push(esc(S.outcome));
      if(S.aud) bits.push('for '+esc(S.aud));
      if(S.proof) bits.push('• '+esc(S.proof));
      return bits.length? `<div class="helper">${bits.join(' ')}</div>` : '';
    }

    function render(){
      setTheme();
      const heroStyle=S.heroImg?`background-image:url('${S.heroImg}')`:'';
      const hasBg=S.heroImg?'has-bg':'';
      const feat=S.features.map(f=>{
        const[h,...r]=f.split(':');const b=r.join(':');
        return `<div class="card"><h3>${esc(h)}</h3>${b?`<p>${esc(b)}</p>`:''}</div>`;
      }).join('');
      $('#preview').innerHTML=`
        <section class="hero ${hasBg}" style="${heroStyle}">
          ${S.heroImg?'<div class="overlay"></div>':''}
          <div class="hero-inner">
            ${S.hideKicker?'':(S.kicker?`<div class="kicker">${esc(S.kicker)}</div>`:'')}
            <h1 class="title">${esc(S.title)}</h1>
            <p class="subtitle">${esc(S.subtitle)}</p>
            ${helperLine()}
            <div class="cta-row">
              ${S.cta1?`<a class="cta" href="${esc(S.contactUrl)}">${esc(S.cta1)}</a>`:''}
              ${S.cta2?`<a class="cta secondary" href="${esc(S.contactUrl)}">${esc(S.cta2)}</a>`:''}
            </div>
          </div>
        </section>
        <section class="features"><div class="features-grid">${feat}</div></section>
        <footer class="footer">
          <span>${esc(S.footer)}</span>
          <span style="opacity:.8">Made fast • Looks modern</span>
        </footer>`;
    }

    function buildExportHtml(){
      const feat=S.features.map(f=>{
        const[h,...r]=f.split(':');const b=r.join(':');
        return `<div class="card"><h3>${esc(h)}</h3>${b?`<p>${esc(b)}</p>`:''}</div>`;
      }).join('');
      const helper=(()=>{
        if(!S.showHelper) return '';
        const bits=[]; if(S.outcome) bits.push(esc(S.outcome)); if(S.aud) bits.push('for '+esc(S.aud)); if(S.proof) bits.push('• '+esc(S.proof));
        return bits.length?`<div style="max-width:880px;color:#cbd5e1">${bits.join(' ')}</div>`:'';
      })();
      return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(S.title)}</title>
<style>
:root{--primary:${S.primary};--accent:${S.accent};--bg:${S.bg};--text:${S.text};--radius:16px;--shadow:0 10px 25px rgba(0,0,0,.25);font-family:ui-sans-serif,system-ui}
*{box-sizing:border-box}body{margin:0;background:${S.bg};color:${S.text}}
.hero{padding:64px 24px;position:relative;${S.heroImg?`background:url('${S.heroImg}') center/cover no-repeat;`:''}}
.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.65))}
.hero-inner{position:relative;max-width:1100px;margin:0 auto;display:grid;gap:18px;justify-items:center;text-align:center}
.kicker{${S.hideKicker?'display:none;':''}color:${S.accent};font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.title{font-size:42px;line-height:1.1;margin:0}.subtitle{max-width:820px;opacity:.95}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cta{padding:12px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:${S.primary};color:#111;font-weight:800;text-decoration:none}
.cta.secondary{background:transparent;color:${S.text}}
.features{padding:36px 24px;background:rgba(255,255,255,.02);border-top:1px solid rgba(255,255,255,.06)}
.features-grid{max-width:1100px;margin:0 auto;display:grid;gap:16px;grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.features-grid{grid-template-columns:1fr}}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px}
.card h3{margin:0 0 6px;font-size:18px}
.footer{padding:20px 24px;border-top:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
</style></head><body>
<section class="hero">${S.heroImg?'<div class="overlay"></div>':''}<div class="hero-inner">
${S.hideKicker?'':(S.kicker?`<div class="kicker">${esc(S.kicker)}</div>`:'')}
<h1 class="title">${esc(S.title)}</h1>
<p class="subtitle">${esc(S.subtitle)}</p>
${helper}
<div class="cta-row">
${S.cta1?`<a class="cta" href="${esc(S.contactUrl)}">${esc(S.cta1)}</a>`:''}
${S.cta2?`<a class="cta secondary" href="${esc(S.contactUrl)}">${esc(S.cta2)}</a>`:''}
</div></div></section>
<section class="features"><div class="features-grid">${feat}</div></section>
<footer class="footer"><span>${esc(S.footer)}</span><span style="opacity:.8">Made fast • Looks modern</span></footer>
</body></html>`;
    }

    /* Sensory feedback (prefers-reduced-motion aware) */
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function softChime(){
      if(prefersReduced) return;
      try{
        const ctx = new (window.AudioContext||window.webkitAudioContext)();
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type='sine'; o.frequency.value=880;
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25);
        o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.26);
      }catch(e){}
    }
    function haptic(){ if(!prefersReduced && 'vibrate' in navigator){ navigator.vibrate(20); } }
    function confettiBurst(){
      if(prefersReduced) return;
      const wrap = document.querySelector('.confetti');
      for(let i=0;i<20;i++){
        const p = document.createElement('i');
        p.style.left = (Math.random()*100)+'%';
        p.style.top = '-12px';
        p.style.background = ['#F57D31','#7FFF00','#ffd166','#06b6d4'][Math.random()*4|0];
        p.style.transform = `translateY(0) rotate(${Math.random()*90|0}deg)`;
        wrap.appendChild(p);
        setTimeout(()=>p.remove(), 1100);
      }
    }
    function celebrate(){ softChime(); haptic(); confettiBurst(); }
    function toast(msg){
      const t = $('#toast'); if(!t) return;
      t.textContent = msg; t.style.display='block';
      setTimeout(()=> t.style.display='none', 900);
    }

    function share(){
      const link=location.origin+location.pathname+'?d='+encodeURIComponent(btoa(JSON.stringify(S)));
      navigator.clipboard.writeText(link);
      $('#btnShare').textContent='Link copied!';
      setTimeout(()=>$('#btnShare').textContent='Copy share link',1200);
      celebrate();
    }
    function shuffle(){
      const p=[['#F57D31','#7FFF00','#0B0F19','#E5E7EB'],['#22C55E','#14B8A6','#0A0A0A','#FAFAFA'],['#F59E0B','#F43F5E','#111827','#F3F4F6'],['#06B6D4','#818CF8','#020617','#E2E8F0'],['#EF4444','#10B981','#0B1220','#F8FAFC']];
      const c=p[Math.random()*p.length|0]; [S.primary,S.accent,S.bg,S.text]=c; reflect(); render(); celebrate();
    }

    function bind(){
      $('#tpl').addEventListener('change',e=>{ (T[e.target.value]||T.generic)(S); reflect(); render(); });
      $('#industry').addEventListener('change',e=> applyHints(e.target.value));

      ['aud','pain','outcome','proof','title','subtitle','kicker','primary','accent','bg','text','heroImg','cta1','cta2','contactUrl','footer']
        .forEach(id=>{
          $('#'+id).addEventListener('input',e=>{S[id]=e.target.value; render();});
          // sensory on commit
          $('#'+id).addEventListener('change',()=>{ toast('Saved'); celebrate(); });
        });

      $('#features').addEventListener('input',e=>{S.features=e.target.value.split('\n').filter(Boolean); render();});
      $('#showHelper').addEventListener('change',e=>{S.showHelper=e.target.checked; render();});
      $('#hideKicker').addEventListener('change',e=>{S.hideKicker=e.target.checked; render();});
      $('#btnRandom').addEventListener('click',shuffle);
      $('#btnCopy').addEventListener('click',()=>{navigator.clipboard.writeText(buildExportHtml());$('#btnCopy').textContent='Copied!';setTimeout(()=>$('#btnCopy').textContent='Copy HTML',1200); celebrate();});
      $('#btnDownload').addEventListener('click',()=>{const blob=new Blob([buildExportHtml()],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=slug(S.title||'landing')+'.html'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},0); celebrate();});
      $('#btnShare').addEventListener('click',share);

      // Skip buttons: fill from hints
      document.querySelectorAll('[data-skip]').forEach(b=>{
        b.addEventListener('click', ()=>{
          const id = b.getAttribute('data-skip');
          const h = HINTS[$('#industry').value] || HINTS.other;
          const map = {aud:'aud', pain:'pain', outcome:'outcome', proof:'proof', title:'title', subtitle:'subtitle'};
          const val = h[map[id]] || '';
          const el = $('#'+id);
          el.value = val; el.dispatchEvent(new Event('input', {bubbles:true}));
          toast('Filled for you'); celebrate();
        });
      });
    }

    (function init(){
      const d=new URL(location.href).searchParams.get('d');
      if(d){ try{Object.assign(S,JSON.parse(atob(decodeURIComponent(d))))}catch{} }
      reflect(); bind(); render(); applyHints($('#industry').value || 'other');
    })();
  </script>
</body>
</html>
