<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicon (tab icon) -->
  <link rel="icon" href="misfit-logo.png" type="image/png" />

  <!-- HTML Meta Tags -->
  <title>Misfit Toys — One Tin Soldier Media Submissions</title>
  <meta name="description" content="Share photos, videos, and memories of One Tin Soldier, a Misfit Toys production.">

  <!-- Facebook Meta Tags -->
  <meta property="og:url" content="https://gofercontent.com/misfit-submit/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Misfit Toys — One Tin Soldier Media Submissions">
  <meta property="og:description" content="Share photos, videos, and memories of One Tin Soldier, a Misfit Toys production.">
  <meta property="og:image" content="https://opengraph.b-cdn.net/production/images/6021c1e9-4cdd-41f6-9f97-d76024c20e50.png?token=4Qu5b14aijA3eW9-J47BMarBzurgy6IlAS2WmR98i3c&height=630&width=1200&expires=33295081589">

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta property="twitter:domain" content="gofercontent.com">
  <meta property="twitter:url" content="https://gofercontent.com/misfit-submit/">
  <meta name="twitter:title" content="Misfit Toys — One Tin Soldier Media Submissions">
  <meta name="twitter:description" content="Share photos, videos, and memories of One Tin Soldier, a Misfit Toys production.">
  <meta name="twitter:image" content="https://opengraph.b-cdn.net/production/images/6021c1e9-4cdd-41f6-9f97-d76024c20e50.png?token=4Qu5b14aijA3eW9-J47BMarBzurgy6IlAS2WmR98i3c&height=630&width=1200&expires=33295081589">

  <style>
    :root{
      --bg:#000; 
      --ink:#fff; 
      --muted:#cfcfcf;
      --card:#0a0a0a;
      --ring:#222;
      --red:#e10600;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Helvetica, Arial, system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif;line-height:1.45}
    a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.35)}
    a:hover{opacity:.85;border-bottom-color:rgba(255,255,255,.6)}
    .wrap{max-width:1100px;margin:auto;padding:24px}

    /* Header */
    header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
    .brand{display:flex;flex-direction:column;align-items:center;gap:12px}
    .brand img.logo{width:64px;height:64px;border-radius:12px;background:#fff;object-fit:contain;padding:6px}
    h1{margin:0;font-size:clamp(28px,6vw,48px);font-weight:900;letter-spacing:-0.02em}
    .tag{color:var(--muted);font-size:16px;max-width:700px}

    /* Buttons */
    .btn{
      display:inline-block;background:transparent;color:#fff;
      padding:14px 18px;border-radius:12px;font-weight:800;letter-spacing:-0.01em;
      border:2px solid var(--red);transition:background .15s ease,color .15s ease;
      text-align:center;
    }
    .btn:hover{background:var(--red);color:#000}

    /* Header actions centered */
    .header-actions{
      display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px;
      width:100%;
    }
    .header-actions .btn{flex:1 1 200px;max-width:240px}
    @media(max-width:720px){
      .header-actions{flex-direction:column;align-items:center}
      .header-actions .btn{width:100%;max-width:300px}
    }

    /* Layout cards */
    .grid{display:grid;gap:18px;margin-top:22px}
    @media(min-width:900px){.grid{grid-template-columns:1.1fr .9fr}}
    section{background:var(--card);border:1px solid var(--ring);border-radius:20px;padding:20px}
    section h2{margin:0 0 10px 0;font-size:22px;font-weight:800}
    .note{color:var(--muted);font-size:14px}

    /* Form */
    form{display:grid;gap:12px}
    label{font-size:14px;font-weight:600}
    input, select, textarea{width:100%;padding:14px;border-radius:12px;border:2px solid #1e1e1e;background:#000;color:#fff;font-weight:600}
    .row{display:grid;gap:12px}
    @media(min-width:720px){.row{grid-template-columns:1fr 1fr}}

    .checks{display:grid;gap:10px;margin-top:4px}
    .check{display:grid;grid-template-columns:28px 1fr;column-gap:10px;align-items:start;font-size:14px;line-height:1.35}
    .check input{width:20px;height:20px;margin:0;align-self:start}

    /* Media */
    .video{aspect-ratio:16/9;width:100%;border:none;border-radius:12px;background:#000}

    /* Gallery */
    .gallery{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-top:12px}
    .card{background:#121216;border:1px solid var(--ring);border-radius:14px;overflow:hidden}
    .thumb{aspect-ratio:16/10;background:#0a0a0b;display:grid;place-items:center;color:#666;text-align:center;padding:8px}
    .card-body{padding:10px}
    .badge{font-size:12px;color:#000;background:#fff;padding:4px 8px;border-radius:999px;font-weight:900}
    .meta{display:flex;justify-content:space-between;align-items:center}

    footer{color:var(--muted);text-align:center;padding:30px 0}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <img class="logo" src="misfit-logo.png" alt="Misfit Toys logo">
        <h1>Misfit Toys — One Tin Soldier</h1>
        <div class="tag">A public archive of memory, play, and community. Share your photos, videos, links, or news articles from <strong>One Tin Soldier</strong> (any location, 2022–2025). Together, we keep the story alive.</div>
      </div>
      <div class="header-actions">
        <a class="btn" href="#submit">Submit your media</a>
        <a class="btn" href="#gallery">See the gallery</a>
        <a class="btn" target="_blank" rel="noopener" href="https://www.gofundme.com/f/help-bring-one-tin-soldier-to-playa-2025-and-beyond">Fuel the 2025 Build</a>
        <a class="btn" href="#volunteer">Get Involved</a>
      </div>
    </header>

    <!-- rest of your sections (form, about, gallery, volunteer, merch, footer) stay unchanged -->
  </div>
</body>
</html>
