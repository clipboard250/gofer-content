<style>
  /* ===== Dark base ===== */
  :root{
    --bg:#0a0a0a; --ink:#e6edf3; --muted:#141414; --line:#232323;

    /* Theme tokens (buttons read these) — “transformative teal” but easily changeable */
    --brand-a:#00d4b4; --brand-b:#00ffd0;  /* gradient endpoints */
    --brand-outline:#2a2f36; --brand-focus:#00ffd0;

    /* Universal button template tokens */
    --btn-bg: linear-gradient(135deg,var(--brand-a),var(--brand-b));
    --btn-bg-hover: linear-gradient(135deg,var(--brand-b),var(--brand-a));
    --btn-border: var(--brand-outline);
    --btn-text: #051019;
    --btn-focus: var(--brand-focus);
    --btn-radius: 14px;
    --btn-pad-y: .85em; --btn-pad-x: 1.4em;
    --btn-font: Inter, Lexend, system-ui, sans-serif;
    --btn-min-tap: 44px;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 ui-monospace,Menlo,Consolas,monospace}
  .wrap{max-width:1140px;margin:0 auto;padding:26px 14px}
  .top{display:flex;justify-content:space-between;align-items:center}
  .grid{display:grid;grid-template-columns:1.2fr .9fr;gap:20px;margin-top:24px}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--muted);border:1px solid var(--line);border-radius:14px;padding:18px}
  h1{font-size:clamp(28px,5vw,64px);line-height:1;margin:8px 0 2px}

  .list{font-size:clamp(18px,2.4vw,26px);line-height:1.25}
  .list a{color:#e6edf3;text-decoration:none;display:block;padding:12px 0;border-bottom:1px solid var(--line)}
  .list a:hover{color:#b8fff1}

  /* ===== Universal Button Template (neutral; themed by tokens above) ===== */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5em;
    min-height:var(--btn-min-tap);padding:var(--btn-pad-y) var(--btn-pad-x);
    border-radius:var(--btn-radius);border:1.5px solid var(--btn-border);
    background:transparent;color:var(--ink);font-family:var(--btn-font);font-weight:600;font-size:1rem;
    letter-spacing:.02em;text-decoration:none;cursor:pointer;line-height:1;user-select:none;
    transition:background .25s ease,box-shadow .25s ease,transform .15s ease,filter .2s ease;
  }
  .btn:hover{transform:translateY(-2px);filter:saturate(1.05)}
  .btn:active{transform:translateY(0)}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--btn-focus)}
  .btn[disabled]{opacity:.55;pointer-events:none;filter:grayscale(.4)}
  .btn--outline{background:transparent;border:2px solid var(--btn-border)}
  .btn--fill{background:var(--btn-bg);border:none;color:var(--btn-text)}
  .btn--fill:hover{background:var(--btn-bg-hover)}
  .btn--ghost{background:none;border:none}
  .btn--block{width:100%}
  .btn--sm{padding:.6em 1em;font-size:.95rem}
  .btn--lg{padding:1em 1.75em;font-size:1.05rem}
  .btn--glass{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px)}
  .btn--glass:hover{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04))}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover,.btn:active{transform:none}}

  .cta{display:grid;gap:10px;margin-top:12px}
  label{font-weight:700}
  input,textarea,button{font:inherit}
  input,textarea{width:100%;padding:12px;border-radius:10px;background:#0f1114;border:1px solid var(--line);color:#fff;min-height:44px}
  input:focus,textarea:focus,.btn:focus-visible{outline:3px solid var(--btn-focus);outline-offset:2px}
  small{color:#9aa5b1}

  /* ===== Bottom ticker ===== */
  .ticker{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:#101214;border-top:1px solid var(--line);
    overflow:hidden;mask-image:linear-gradient(to right,transparent 0,black 40px,black calc(100% - 40px),transparent 100%);
  }
  .track{
    display:flex;gap:40px;white-space:nowrap;align-items:center;padding:10px 0;color:#cfe3f5;
    animation:scroll 22s linear infinite;
  }
  .track b{color:#b8fff1}
  .tick-btn{margin-right:16px}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.track{animation:none}}

<script>
  // --- Daily spots: Sun=10, Mon=9, Tue=8, Wed=7, Thu=6, Fri=5, Sat=1

</script>
